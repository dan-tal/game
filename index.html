<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Arcade Vesel 🎮</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#6ec6f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arcade Vesel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css">
</head>
<body>
<noscript><p style="padding:24px;font:20px sans-serif;text-align:center">Arcade Vesel are nevoie de JavaScript ca să meargă. 🎮</p></noscript>
<button id="debugToggle">🐞 debug</button>
<div id="debugPanel"></div>
<div id="appFooter"></div>
<div id="rotateHint">📱 Întoarce telefonul pe verticală ca să joci mai mare</div>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="420" height="700"></canvas>
    <button id="homeBtn" title="Acasă">🏠</button>
    <div id="creditsBadge"></div>
    <div id="hud">
      <div id="hearts"></div>
      <div id="score">⭐ 0</div>
    </div>
    <div id="screenAgeSelect" class="screen">
      <h1>Câți ani ai? 🎂</h1>
      <h2>Alege vârsta ta</h2>
      <div class="typeRow" id="ageRow"></div>
    </div>

    <div id="screenMenu" class="screen menuScreen">
      <button id="muteBtn" type="button" title="Sunet">🔊</button>
      <h1>Ce joc vrei să joci? 🎮</h1>
      <div id="dailyGoal" class="dailyGoal"></div>
      <!-- tile-urile se construiesc in shell.js din games-catalog.js, dupa varsta copilului -->
      <div class="menuTileRow" id="menuTileRow"></div>
    </div>

    <div id="screenSelect" class="screen">
      <h1>Alege mașina ta! 🚗</h1>
      <h2>Ce culoare?</h2>
      <div class="colorRow" id="colorRow"></div>
      <h2>Ce tip de vehicul?</h2>
      <div class="typeRow" id="typeRow">
        <button class="typeBtn" data-type="car"><span class="emoji">🚗</span>Mașină</button>
        <button class="typeBtn" data-type="moto"><span class="emoji">🏍️</span>Motocicletă</button>
        <button class="typeBtn" data-type="tractor"><span class="emoji">🚜</span>Tractor</button>
      </div>
      <button id="startBtn" class="bigStartBtn" disabled>Start! 🚦</button>
    </div>

    <div id="screenFarmSelect" class="screen">
      <h1>Alege coșul tău! 🧺</h1>
      <h2>Ce culoare?</h2>
      <div class="colorRow" id="farmColorRow"></div>
      <button id="farmStartBtn" class="bigStartBtn" disabled>Start! 🚦</button>
    </div>

    <div id="screenMazeSelect" class="screen">
      <h1>Alege culoarea felinarului tău! 🏮</h1>
      <h2>Ce culoare?</h2>
      <div class="colorRow" id="mazeColorRow"></div>
      <button id="mazeStartBtn" class="bigStartBtn" disabled>Start! 🚦</button>
    </div>

    <div id="exerciseSlot"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="admin.js"></script>
<script src="age.js"></script>
<script src="debug.js"></script>
<script src="playtime.js"></script>
<script src="progress.js"></script>
<script src="credits.js"></script>
<script src="games-catalog.js"></script>
<script src="exercises.js"></script>
<script src="games/game-shared.js"></script>
<script src="games/car-game.config.js"></script>
<script src="games/car-game.js"></script>
<script src="games/farm-game.config.js"></script>
<script src="games/farm-game.js"></script>
<script src="games/balloon-game.config.js"></script>
<script src="games/balloon-game.js"></script>
<script src="games/numbers-game.config.js"></script>
<script src="games/numbers-game.js"></script>
<script src="games/fruit-game.config.js"></script>
<script src="games/fruit-game.js"></script>
<script src="games/count-game.config.js"></script>
<script src="games/count-game.js"></script>
<script src="games/fishing-game.config.js"></script>
<script src="games/fishing-game.js"></script>
<script src="games/shape-game.config.js"></script>
<script src="games/shape-game.js"></script>
<script src="games/zoo-game.config.js"></script>
<script src="games/zoo-game.js"></script>
<script src="games/pawpatrol-game.config.js"></script>
<script src="games/pawpatrol-game.js"></script>
<script src="games/train-game.config.js"></script>
<script src="games/train-game.js"></script>
<script src="games/boat-game.config.js"></script>
<script src="games/boat-game.js"></script>
<script src="games/letter-game.config.js"></script>
<script src="games/letter-game.js"></script>
<script src="games/maze-game.config.js"></script>
<script src="games/maze-game.js"></script>
<script src="games/math-game.config.js"></script>
<script src="games/math-equations.js"></script>
<script src="games/math-game.js"></script>
<script src="games/math-duel-game.config.js"></script>
<script src="games/math-duel-game.js"></script>
<script src="games/memory-game.config.js"></script>
<script src="games/memory-game.js"></script>
<script src="games/shapes-duel-game.config.js"></script>
<script src="games/shapes-duel-game.js"></script>
<script src="games/simon-game.config.js"></script>
<script src="games/simon-game.js"></script>
<script src="games/puzzle-game.config.js"></script>
<script src="games/puzzle-game.js"></script>
<script src="games/math-duel-online-game.config.js"></script>
<script src="games/math-duel-online-game.js"></script>
<script src="version.js"></script>
<script src="shell.js"></script>
<script>document.getElementById('appFooter').textContent = 'v' + (window.APP_VERSION || 'dev');</script>
</body>
</html>
