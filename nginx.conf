server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # DNS-ul Docker; permite pornirea nginx chiar dacă serviciul de control nu e încă pornit
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Control TV (serviciul coloring-tv), doar în rețeaua locală
    location /tv/ {
        set $tv http://coloring-tv:8080;
        rewrite ^/tv/(.*)$ /$1 break;
        proxy_pass $tv;
        proxy_read_timeout 40s;
        proxy_connect_timeout 3s;
    }

    # pagini și date: fără cache vechi pe telefoane
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
