server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # admin.html accesibil si fara extensie, ca link mai scurt
    location = /admin {
        try_files /admin.html =404;
    }

    # pagina pentru televizor (2 copii, tastatura)
    location = /tv {
        try_files /tv.html =404;
    }

    # nginx nu cunoaste extensia .webmanifest si il serveste ca
    # application/octet-stream — browserele preferă tipul corect
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-App-Version "20261018-1736-78c85d5" always;
    }

    # comprimare: fara ea, ~300KB de JS/CSS se descarcau necomprimat pe fiecare
    # deschidere — pe date mobile conteaza
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;

    # pachetele cu hash de continut in nume (index.<hash>.js, style.<hash>.css — vezi
    # tools/build.js): un fisier cu acelasi nume nu se schimba NICIODATA, deci stau in cache
    # un an fara sa mai intrebe serverul. Un deploy nou are alte nume, iar index.html (mereu
    # proaspat, vezi mai jos) trimite la ele.
    location ~* "\.[0-9a-f]{10}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-App-Version "20261018-1736-78c85d5" always;
        try_files $uri =404;
    }

    # sectiunea Colorat: /colorat -> /colorat/ ; planșele SVG se schimba rar (cache o zi)
    location = /colorat {
        return 301 /colorat/;
    }
    location ^~ /colorat/data/pages/ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # TOATE celelalte fisiere (index.html, version.js, sw.js, imagini...) trebuie sa fie mereu
    # proaspete. "no-cache" inseamna "verifica la server inainte de folosire": nginx trimite
    # ETag, deci daca nu s-a schimbat raspunsul e doar un 304 de cativa octeti, nu o noua
    # descarcare. Inainte era "no-store", care re-descarca tot de fiecare data. Scopul (sa nu
    # ramana in telefon un fisier vechi alaturi de unul nou) e acelasi si cu "no-cache".
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-App-Version "20261018-1736-78c85d5" always;
        try_files $uri $uri/ =404;
    }
}
